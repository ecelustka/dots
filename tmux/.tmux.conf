# ~/.tmux.conf — Ghostty + Catppuccin Macchiato, hand-rolled rectangular theme

# ── Core ─────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi

# Render images / titles
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string '#T'

# vim keys in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# True color under Ghostty (outer TERM is xterm-ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -as terminal-overrides ',xterm-256color:Tc'

# Windows/panes from 1, keep numbering dense
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Open new window/splits in current directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (prefix h/j/k/l; Ghostty sends these on cmd+alt+h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Rename via centered popup (prefix ,  and  prefix $)
bind , display-popup -w 44 -h 3 -T "#[fg=#f5a97f,bold]  rename window: #W " -E "~/.config/tmux/scripts/rename-popup.sh window"
bind '$' display-popup -w 44 -h 3 -T "#[fg=#f5a97f,bold]  rename session: #S " -E "~/.config/tmux/scripts/rename-popup.sh session"
# Kill pane / window via confirm popup (prefix x  and  prefix &)
bind x display-popup -w 36 -h 3 -S "fg=#ed8796" -T "#[fg=#ed8796,bold]  kill pane: #{pane_current_command} " -E "~/.config/tmux/scripts/confirm-kill.sh pane"
bind '&' display-popup -w 36 -h 3 -S "fg=#ed8796" -T "#[fg=#ed8796,bold]  kill window: #W " -E "~/.config/tmux/scripts/confirm-kill.sh window"
# Window select (prefix 0-9) — missing window shows red popup, not status-line text
bind 0 run-shell "~/.config/tmux/scripts/goto-window.sh 0"
bind 1 run-shell "~/.config/tmux/scripts/goto-window.sh 1"
bind 2 run-shell "~/.config/tmux/scripts/goto-window.sh 2"
bind 3 run-shell "~/.config/tmux/scripts/goto-window.sh 3"
bind 4 run-shell "~/.config/tmux/scripts/goto-window.sh 4"
bind 5 run-shell "~/.config/tmux/scripts/goto-window.sh 5"
bind 6 run-shell "~/.config/tmux/scripts/goto-window.sh 6"
bind 7 run-shell "~/.config/tmux/scripts/goto-window.sh 7"
bind 8 run-shell "~/.config/tmux/scripts/goto-window.sh 8"
bind 9 run-shell "~/.config/tmux/scripts/goto-window.sh 9"


# ── Plugins ──────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'

run '~/.tmux/plugins/tpm/tpm'

# ── Theme: Catppuccin Macchiato — flat rectangular blocks ────────
# base #24273a  mantle #1e2030  crust #181926
# surface0 #363a4f  surface1 #494d64  overlay0 #6e738d
# text #cad3f5  subtext0 #a5adcb
# mauve #c6a0f6  blue #8aadf4  peach #f5a97f  green #a6da95

set -g status on
# Two rows: content + blank spacer row -> breathing room under the bar
set -g status 2
set -g status-format[1] ''
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# Solid mantle strip
set -g status-style "bg=#24273a,fg=#a5adcb"

# Left: session block (#S = session name; rename with prefix $)
# mauve normally, peach while prefix held, green in copy mode
set -g status-left "#[fg=#{?client_prefix,#f5a97f,#{?pane_in_mode,#a6da95,#c6a0f6}},bg=#24273a]#[fg=#181926,bg=#{?client_prefix,#f5a97f,#{?pane_in_mode,#a6da95,#c6a0f6}},bold] #S#[fg=#{?client_prefix,#f5a97f,#{?pane_in_mode,#a6da95,#c6a0f6}},bg=#24273a]  "

# Right: empty (clock/date off)
set -g status-right ""

# Windows: variant A — active = solid blue rounded pill, inactive = dim text.
# Inactive padded with spaces matching cap width -> no jump on switch.
set -g window-status-separator " "
set -g window-status-format "#[fg=#6e738d,bg=#24273a] #I #[fg=#a5adcb]#W#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=#8aadf4,bg=#24273a]#[fg=#181926,bg=#8aadf4,bold]#I #W#{?window_zoomed_flag, ,}#[fg=#8aadf4,bg=#24273a]"
set -g window-status-style "none"
set -g window-status-current-style "none"
set -g window-status-bell-style "none"
set -g window-status-activity-style "none"

# Command prompt / messages fallback styling
set -g message-style "bg=#363a4f,fg=#f5a97f,bold"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"

# Popups (rename boxes) — rectangular border, blue frame, mantle fill
set -g popup-border-lines single
set -g popup-border-style "fg=#8aadf4"
set -g popup-style "bg=#1e2030,fg=#cad3f5"

# Pane borders
set -g pane-border-lines single
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g pane-border-status off

# Copy mode selection + search highlight
set -g mode-style "bg=#494d64,fg=#cad3f5"
set -g copy-mode-match-style "bg=#eed49f,fg=#181926"
set -g copy-mode-current-match-style "bg=#f5a97f,fg=#181926"

# Choose-tree / menus
set -g menu-style "bg=#1e2030,fg=#cad3f5"
set -g menu-selected-style "bg=#8aadf4,fg=#181926,bold"
set -g menu-border-style "bg=#1e2030,fg=#8aadf4"

# Clock (prefix t)
setw -g clock-mode-colour "#8aadf4"
